spring.application.name=demo
server.port=8080

# 数据库连接地址
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
# 驱动类
spring.datasource.driver-class-name=com.mysql.jdbc.Driver


# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.myspringboot.entity
# 下划线自动映射驼峰 user_name -> userName
mybatis.configuration.map-underscore-to-camel-case=true
# 控制台打印SQL
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl